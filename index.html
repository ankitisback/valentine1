<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🎵 AUDIO MUST STAY OUTSIDE -->
<audio id="bgMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- 🔁 ONLY THIS CONTENT CHANGES -->
<div id="app" class="container">
  <h1>Do you think she’ll say yes? 🥹💖</h1>
  <p class="tap-note">🔊 Tap anywhere to start music</p>

  <img src="photo.jpg" class="her-photo" alt="Her photo">

  <p class="final-question">Will you be my Valentine? 🌸</p>

  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">Think again 😏</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
